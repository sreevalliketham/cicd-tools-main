<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (address) {
      <div>
        <h2 data-cy="addressDetailsHeading"><span>Address</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ address.id }}</span>
          </dd>
          <dt><span>Aid</span></dt>
          <dd>
            <span>{{ address.aid }}</span>
          </dd>
          <dt><span>Street</span></dt>
          <dd>
            <span>{{ address.street }}</span>
          </dd>
          <dt><span>Citi</span></dt>
          <dd>
            <span>{{ address.citi }}</span>
          </dd>
          <dt><span>Onetoone</span></dt>
          <dd>
            @if (address.onetoone) {
              <div>
                <a [routerLink]="['/address', address.onetoone.id, 'view']">{{ address.onetoone.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/myapplication/address', address.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
